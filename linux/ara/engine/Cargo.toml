# bada's engine (engine/, bada-engine) as a Linux shared library: libara_engine.so, the engine ara's
# ime.json loads. The engine is bada ime's, unchanged; this crate only builds it as a cdylib so
# bada-linux (linux/host) can load it at run time through its C ABI (engine/include/bada.h, prefix "bada").
[package]
name = "ara-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "ara_engine"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bada-engine = { path = "../../../engine" }

[profile.release]
opt-level = "s"
lto = true
